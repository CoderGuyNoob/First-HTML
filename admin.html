<!DOCTYPE html>
<html lang="en" class="jeopardy-theme">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  (function() {
    const saved = localStorage.getItem("jeopardy_theme");
    if (saved === "light" || (!saved && window.matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("light-theme");
    }
  })();
</script>
<link rel="stylesheet" href="Styles.css">
</head>
<body class="admin-page">

<div class="header">
  <h1>Jeopardy Admin</h1>
  <a class="back" href="/Jeopardy/jeopardy.html">&larr; Back to Game</a>
  <button class="back" id="themeToggle" onclick="toggleTheme()" style="background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);border:none;font-family:'Nunito',sans-serif;">Light Mode</button>
</div>

<div id="toast"></div>

<div class="container">
  <div id="error"></div>

  <div id="view-list">
    <div class="bubble">
      <div class="bubble-title">Create New Game</div>
      <div class="create-row">
        <div>
          <label>Game Name</label>
          <input type="text" id="newName" placeholder="e.g. Biology 101">
        </div>
        <div>
          <label>Password (alphanumeric)</label>
          <div class="pw-row">
            <div><input type="text" id="newPw" placeholder="Type or generate"></div>
            <button class="btn-gen" onclick="genPw()">Generate</button>
          </div>
        </div>
        <div>
          <label>&nbsp;</label>
          <button class="btn btn-save" onclick="createGame()">Create</button>
        </div>
      </div>
    </div>

    <div class="bubble">
      <div class="bubble-title">Your Games</div>
      <div id="gameList"></div>
    </div>
  </div>

  <div id="view-editor" style="display:none">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <button class="btn btn-back" onclick="backToList()">&larr; Games</button>
      <span style="font-family:'Fredoka One',cursive; font-size:18px; color:var(--accent);" id="editorTitle"></span>
      <span style="font-family:'Fredoka One',cursive; font-size:14px; color:var(--accent); letter-spacing:2px;" id="editorCode"></span>
      <span style="font-size:11px; color:var(--text-muted);" id="editorPw"></span>
    </div>

    <div class="bubble">
      <div class="bubble-title">Settings</div>
      <div class="settings-row">
        <div>
          <label>Teams</label>
          <input type="number" id="teamCount" min="1" max="10" value="3">
        </div>
        <input type="hidden" id="values" value="100, 200, 300, 400, 500">
      </div>
    </div>

    <div id="categories"></div>

    <button class="btn btn-add-big" onclick="addCategory()">+ New Category</button>

    <div class="actions">
      <button class="btn btn-discard" onclick="loadGameData()">Discard</button>
      <button class="btn btn-save" onclick="saveGameData()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h2>New Category</h2>
    <input type="text" id="modalInput" placeholder="Category name..." onkeydown="if(event.key==='Enter')confirmModal()">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-confirm" onclick="confirmModal()">Add</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="confirmBg" onclick="if(event.target===this)resolveConfirm(false)">
  <div class="modal-box">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMsg" style="color:var(--text-muted);margin-bottom:20px;font-size:14px;line-height:1.5;"></p>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="resolveConfirm(false)">Cancel</button>
      <button class="btn btn-confirm" onclick="resolveConfirm(true)">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="promptBg" onclick="if(event.target===this)resolvePrompt(null)">
  <div class="modal-box">
    <h2 id="promptTitle">Enter value</h2>
    <input type="text" id="promptInput" placeholder="" onkeydown="if(event.key==='Enter')resolvePrompt(document.getElementById('promptInput').value)">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="resolvePrompt(null)">Cancel</button>
      <button class="btn btn-confirm" onclick="resolvePrompt(document.getElementById('promptInput').value)">OK</button>
    </div>
  </div>
</div>

<script>
let currentCode = null;
let currentPw = null;
let gameData = { categories: [], cards: [] };
const CAT_COLORS = ['pill-0','pill-1','pill-2','pill-3','pill-4','pill-5','pill-6','pill-7','pill-8','pill-9'];

function toast(msg, ok) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = ok ? "show ok" : "show err";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ""; }, 2500);
}

function showError(msg) {
  const el = document.getElementById("error");
  el.innerHTML = msg ? '<div class="error-banner">' + msg + '</div>' : "";
}

// ── Styled confirm/prompt ──

let _confirmResolve = null;
function showConfirm(title, msg) {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmMsg").textContent = msg;
    document.getElementById("confirmBg").classList.add("open");
  });
}
function resolveConfirm(val) {
  document.getElementById("confirmBg").classList.remove("open");
  if (_confirmResolve) { _confirmResolve(val); _confirmResolve = null; }
}

let _promptResolve = null;
function showPrompt(title, placeholder) {
  return new Promise(resolve => {
    _promptResolve = resolve;
    document.getElementById("promptTitle").textContent = title;
    const inp = document.getElementById("promptInput");
    inp.value = "";
    inp.placeholder = placeholder || "";
    document.getElementById("promptBg").classList.add("open");
    setTimeout(() => inp.focus(), 50);
  });
}
function resolvePrompt(val) {
  document.getElementById("promptBg").classList.remove("open");
  if (_promptResolve) { _promptResolve(val); _promptResolve = null; }
}

function genPw() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let pw = '';
  for (let i = 0; i < 8; i++) pw += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById("newPw").value = pw;
}

// ── Game list ──

async function loadGames() {
  showError("");
  try {
    const res = await fetch("/api/games");
    const games = await res.json();
    const list = document.getElementById("gameList");
    list.innerHTML = "";
    if (games.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--muted-text);padding:20px;">No games yet. Create one above!</div>';
      return;
    }
    games.forEach(g => {
      const div = document.createElement("div");
      div.className = "game-list-item";
      div.innerHTML =
        '<span class="game-code">' + g.game_code + '</span>' +
        '<span class="game-name">' + esc(g.name) + '</span>' +
        '<span class="game-date">' + new Date(g.created_at).toLocaleDateString() + '</span>' +
        '<div class="game-actions">' +
          '<button class="btn btn-save" style="padding:6px 14px;font-size:12px;border-radius:10px;" onclick="editGame(\'' + g.game_code + '\')">Edit</button>' +
          '<button class="btn btn-delete-game" onclick="deleteGame(\'' + g.game_code + '\',\'' + esc(g.name) + '\')">Delete</button>' +
        '</div>';
      list.appendChild(div);
    });
  } catch (e) {
    showError("Could not load games. Is the server running?");
  }
}

async function createGame() {
  const name = document.getElementById("newName").value.trim();
  const pw = document.getElementById("newPw").value.trim();
  if (!name) { toast("Enter a game name", false); return; }
  if (!pw) { toast("Enter or generate a password", false); return; }
  if (!/^[A-Za-z0-9]+$/.test(pw)) { toast("Password must be alphanumeric", false); return; }

  try {
    const res = await fetch("/api/games/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password: pw })
    });
    const data = await res.json();
    if (data.error) { toast(data.error, false); return; }
    toast("Game created! Code: " + data.game_code, true);
    document.getElementById("newName").value = "";
    document.getElementById("newPw").value = "";
    loadGames();
  } catch (e) {
    toast("Failed to create game", false);
  }
}

async function deleteGame(code, name) {
  const ok = await showConfirm('Delete Game', 'Delete "' + name + '" (' + code + ")? This cannot be undone.");
  if (!ok) return;
  try {
    await fetch("/api/games/" + code, { method: "DELETE" });
    toast("Deleted", true);
    loadGames();
  } catch (e) {
    toast("Failed to delete", false);
  }
}

// ── Editor ──

async function editGame(code) {
  const pw = await showPrompt("Password for " + code, "Enter password");
  if (!pw) return;
  try {
    const res = await fetch("/api/games/" + code + "/data?password=" + encodeURIComponent(pw));
    if (!res.ok) { toast("Wrong password", false); return; }
    const data = await res.json();
    if (data.error) { toast(data.error, false); return; }
    currentCode = code;
    currentPw = pw;
    localStorage.setItem("jeopardy_game", JSON.stringify({ code, pw }));
    gameData = { categories: data.categories || [], cards: data.cards || [] };
    document.getElementById("teamCount").value = data.teamCount || 3;
    document.getElementById("values").value = (data.values || [100,200,300,400,500]).join(", ");

    document.getElementById("editorTitle").textContent = document.querySelector('.game-list-item .game-name') ? "" : "";
    document.getElementById("editorCode").textContent = code;
    document.getElementById("editorPw").textContent = "Password: " + pw;

    document.getElementById("view-list").style.display = "none";
    document.getElementById("view-editor").style.display = "block";
    renderAll();
  } catch (e) {
    toast("Could not load game", false);
  }
}

function backToList() {
  document.getElementById("view-list").style.display = "block";
  document.getElementById("view-editor").style.display = "none";
  currentCode = null;
  currentPw = null;
  localStorage.removeItem("jeopardy_game");
  loadGames();
}

async function restoreSession() {
  const saved = localStorage.getItem("jeopardy_game");
  if (!saved) return false;
  try {
    const { code, pw } = JSON.parse(saved);
    const res = await fetch("/api/games/" + code + "/data?password=" + encodeURIComponent(pw));
    if (!res.ok) { localStorage.removeItem("jeopardy_game"); return false; }
    const data = await res.json();
    if (data.error) { localStorage.removeItem("jeopardy_game"); return false; }
    currentCode = code;
    currentPw = pw;
    gameData = { categories: data.categories || [], cards: data.cards || [] };
    document.getElementById("teamCount").value = data.teamCount || 3;
    document.getElementById("values").value = (data.values || [100,200,300,400,500]).join(", ");
    document.getElementById("editorCode").textContent = code;
    document.getElementById("editorPw").textContent = "Password: " + pw;
    document.getElementById("view-list").style.display = "none";
    document.getElementById("view-editor").style.display = "block";
    renderAll();
    return true;
  } catch (e) {
    localStorage.removeItem("jeopardy_game");
    return false;
  }
}

// ── Render ──

function renderAll() {
  const wrap = document.getElementById("categories");
  wrap.innerHTML = "";

  if (gameData.categories.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="big-emoji">No categories yet!</div>Click the button below to add your first category.</div>';
    return;
  }
  gameData.categories.forEach((cat, ci) => wrap.appendChild(buildCatCard(cat, ci)));
}

function buildCatCard(catName, ci) {
  const card = document.createElement("div");
  card.className = "cat-card";
  const colorClass = CAT_COLORS[ci % CAT_COLORS.length];
  const values = getValues();

  const header = document.createElement("div");
  header.className = "cat-header";
  header.innerHTML =
    '<div class="cat-color ' + colorClass + '"></div>' +
    '<input type="text" class="cat-name-input" value="' + esc(catName) + '">' +
    '<div class="cat-actions"><button class="btn btn-remove-cat" title="Delete category">Delete</button></div>';
  card.appendChild(header);

  header.querySelector(".cat-name-input").addEventListener("input", function() {
    const old = gameData.categories[ci];
    const newName = this.value.trim();
    gameData.categories[ci] = newName;
    gameData.cards.forEach(c => { if (c.category === old) c.category = newName; });
  });
  header.querySelector(".btn-remove-cat").addEventListener("click", async () => {
    const ok = await showConfirm('Delete Category', 'Delete "' + catName + '" and all its questions?');
    if (!ok) return;
    gameData.categories.splice(ci, 1);
    gameData.cards = gameData.cards.filter(c => c.category !== catName);
    renderAll();
  });

  const cards = getCardsForCategory(catName);
  cards.forEach((c, qi) => {
    const row = buildQRow(c, qi, values, catName);
    card.appendChild(row);
  });

  const addBtn = document.createElement("button");
  addBtn.className = "btn btn-add";
  addBtn.style.marginTop = "8px";
  addBtn.innerHTML = "+ Add Question";
  addBtn.onclick = () => {
    const catCards = getCardsForCategory(catName);
    gameData.cards.push({ category: catName, order: catCards.length, dailyDouble: false, question: "", answer: "" });
    renderAll();
  };
  card.appendChild(addBtn);

  return card;
}

function buildQRow(c, qi, values, catName) {
  const row = document.createElement("div");
  row.className = "q-row";
  row.draggable = true;
  row.dataset.cat = catName;
  row.dataset.idx = qi;

  const dragHandle = document.createElement("div");
  dragHandle.className = "drag-handle";
  dragHandle.textContent = "\u2807";
  row.appendChild(dragHandle);

  const posBadge = document.createElement("div");
  posBadge.className = "pos-badge";
  posBadge.textContent = qi < values.length ? "$" + values[qi] : "$?";
  row.appendChild(posBadge);

  const qCol = document.createElement("div");
  qCol.className = "q-col";
  qCol.innerHTML = '<div class="q-label">Question</div>';
  const qArea = document.createElement("textarea");
  qArea.value = c.question; qArea.placeholder = "Type the question...";
  qArea.oninput = () => { c.question = qArea.value; };
  qCol.appendChild(qArea);
  row.appendChild(qCol);

  const aCol = document.createElement("div");
  aCol.className = "q-col";
  aCol.innerHTML = '<div class="q-label">Answer</div>';
  const aArea = document.createElement("textarea");
  aArea.value = c.answer; aArea.placeholder = "Type the answer...";
  aArea.oninput = () => { c.answer = aArea.value; };
  aCol.appendChild(aArea);
  row.appendChild(aCol);

  const ddCol = document.createElement("div");
  ddCol.className = "q-col";
  ddCol.style.alignItems = "center";
  ddCol.innerHTML = '<div class="q-label">DD</div>';
  const ddCheck = document.createElement("input");
  ddCheck.type = "checkbox";
  ddCheck.checked = !!c.dailyDouble;
  ddCheck.style.width = "auto";
  ddCheck.style.margin = "22px 0 0";
  ddCheck.style.accentColor = "var(--accent)";
  ddCheck.onchange = () => { c.dailyDouble = ddCheck.checked; };
  ddCol.appendChild(ddCheck);
  row.appendChild(ddCol);

  const delBtn = document.createElement("button");
  delBtn.className = "btn-del-q";
  delBtn.title = "Remove question";
  delBtn.textContent = "\u00d7";
  delBtn.onclick = () => {
    const idx = gameData.cards.indexOf(c);
    if (idx !== -1) gameData.cards.splice(idx, 1);
    renderAll();
  };
  row.appendChild(delBtn);

  row.addEventListener("dragstart", (e) => {
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "");
    window._dragRow = row;
  });
  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    document.querySelectorAll(".q-row.drag-over").forEach(r => r.classList.remove("drag-over"));
    window._dragRow = null;
  });
  row.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const dragging = window._dragRow;
    if (dragging && dragging.dataset.cat === catName) {
      row.classList.add("drag-over");
    }
  });
  row.addEventListener("dragleave", () => {
    row.classList.remove("drag-over");
  });
  row.addEventListener("drop", (e) => {
    e.preventDefault();
    row.classList.remove("drag-over");
    const dragging = window._dragRow;
    if (!dragging || dragging.dataset.cat !== catName) return;
    const fromIdx = parseInt(dragging.dataset.idx);
    const toIdx = parseInt(row.dataset.idx);
    if (fromIdx === toIdx) return;
    const catCards = gameData.cards.filter(c => c.category === catName);
    const movingCard = catCards[fromIdx];
    const otherCards = gameData.cards.filter(c => c !== movingCard);
    const insertBefore = otherCards.findIndex(c => c === catCards[toIdx]);
    if (insertBefore === -1) {
      otherCards.push(movingCard);
    } else {
      otherCards.splice(insertBefore, 0, movingCard);
    }
    gameData.cards = otherCards;
    updateOrderFields(catName);
    renderAll();
  });

  let touchDragging = false;
  dragHandle.addEventListener("touchstart", (e) => {
    e.preventDefault();
    touchDragging = true;
    row.classList.add("dragging");
    window._dragRow = row;
  }, { passive: false });
  dragHandle.addEventListener("touchmove", (e) => {
    if (!touchDragging) return;
    e.preventDefault();
    const touch = e.touches[0];
    const allRows = Array.from(document.querySelectorAll('.q-row[data-cat="' + catName + '"]'));
    allRows.forEach(r => r.classList.remove("drag-over"));
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const targetRow = target ? target.closest(".q-row") : null;
    if (targetRow && targetRow.dataset.cat === catName && targetRow !== row) {
      targetRow.classList.add("drag-over");
    }
  }, { passive: false });
  dragHandle.addEventListener("touchend", (e) => {
    if (!touchDragging) return;
    touchDragging = false;
    row.classList.remove("dragging");
    const touch = e.changedTouches[0];
    const allRows = Array.from(document.querySelectorAll('.q-row[data-cat="' + catName + '"]'));
    allRows.forEach(r => r.classList.remove("drag-over"));
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const targetRow = target ? target.closest(".q-row") : null;
    if (targetRow && targetRow.dataset.cat === catName && targetRow !== row) {
      const fromIdx = parseInt(row.dataset.idx);
      const toIdx = parseInt(targetRow.dataset.idx);
      const catCards = gameData.cards.filter(c => c.category === catName);
      const movingCard = catCards[fromIdx];
      const otherCards = gameData.cards.filter(c => c !== movingCard);
      const insertBefore = otherCards.findIndex(c => c === catCards[toIdx]);
      if (insertBefore === -1) {
        otherCards.push(movingCard);
      } else {
        otherCards.splice(insertBefore, 0, movingCard);
      }
      gameData.cards = otherCards;
      updateOrderFields(catName);
      renderAll();
    }
    window._dragRow = null;
  });

  return row;
}

// ── Add category ──

function addCategory() {
  document.getElementById("modalInput").value = "";
  document.getElementById("modalBg").classList.add("open");
  setTimeout(() => document.getElementById("modalInput").focus(), 50);
}

function confirmModal() {
  const name = document.getElementById("modalInput").value.trim();
  if (!name) return;
  gameData.categories.push(name);
  renderAll();
  closeModal();
}

function closeModal() {
  document.getElementById("modalBg").classList.remove("open");
}

// ── Helpers ──

function getValues() {
  return document.getElementById("values").value.split(",").map(s => parseInt(s.trim())).filter(n => !isNaN(n));
}
function esc(s) { return s.replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function getCardsForCategory(catName) {
  return gameData.cards.filter(c => c.category === catName);
}

function updateOrderFields(catName) {
  const cards = gameData.cards.filter(c => c.category === catName);
  cards.forEach((c, i) => { c.order = i; });
}

// ── Save ──

async function saveGameData() {
  if (!currentCode || !currentPw) { toast("No game selected", false); return; }
  const teamCount = parseInt(document.getElementById("teamCount").value) || 3;
  const values = getValues();

  try {
    const res = await fetch("/api/games/" + currentCode + "/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: currentPw,
        teamCount: teamCount,
        values: values,
        categories: gameData.categories,
        cards: gameData.cards,
      })
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    toast("Saved!", true);
  } catch (e) {
    toast("Save failed — is the server running?", false);
  }
}

// ── Theme ──

function toggleTheme() {
  const isLight = document.documentElement.classList.toggle("light-theme");
  localStorage.setItem("jeopardy_theme", isLight ? "light" : "dark");
  updateThemeButton();
}

function updateThemeButton() {
  const btn = document.getElementById("themeToggle");
  if (!btn) return;
  const isLight = document.documentElement.classList.contains("light-theme");
  btn.textContent = isLight ? "Dark Mode" : "Light Mode";
}

// ── Init ──

(async function() {
  updateThemeButton();
  const restored = await restoreSession();
  if (!restored) loadGames();
})();
</script>
</body>
</html>
