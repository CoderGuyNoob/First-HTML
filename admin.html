<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; }

  #sidebar {
    width: 220px; background: #16213e; padding: 16px; display: flex; flex-direction: column; gap: 6px;
    border-right: 2px solid #0f3460; overflow-y: auto;
  }
  #sidebar h2 { color: #e94560; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
  .file-btn {
    background: #0f3460; border: none; color: #e0e0e0; padding: 10px 12px; text-align: left;
    cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 13px;
  }
  .file-btn:hover { background: #e94560; color: #fff; }
  .file-btn.active { background: #e94560; color: #fff; }

  #editor-area { flex: 1; display: flex; flex-direction: column; }

  #toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: #16213e; border-bottom: 2px solid #0f3460;
  }
  #toolbar .filename { color: #e94560; font-size: 15px; font-weight: bold; }
  #save-btn {
    background: #e94560; color: #fff; border: none; padding: 8px 20px;
    cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 13px; font-weight: bold;
  }
  #save-btn:hover { background: #c73652; }
  #status { color: #53d769; font-size: 12px; margin-left: auto; opacity: 0; transition: opacity 0.3s; }

  #editor {
    flex: 1; width: 100%; background: #0a0a1a; color: #53d769; border: none;
    font-family: 'Consolas', 'Courier New', monospace; font-size: 14px;
    padding: 16px; resize: none; outline: none; line-height: 1.6; tab-size: 2;
  }

  #new-file-area {
    margin-top: auto; display: flex; gap: 4px; padding-top: 10px; border-top: 1px solid #0f3460;
  }
  #new-file-area input {
    flex: 1; background: #0a0a1a; border: 1px solid #0f3460; color: #e0e0e0;
    padding: 8px; font-family: monospace; font-size: 12px; border-radius: 4px;
  }
  #new-file-area button {
    background: #53d769; border: none; color: #000; padding: 8px 10px;
    cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Files</h2>
  <div id="file-list"></div>
  <div id="new-file-area">
    <input id="new-filename" placeholder="newfile.html">
    <button onclick="createNewFile()">+</button>
  </div>
</div>

<div id="editor-area">
  <div id="toolbar">
    <span class="filename" id="current-file">Select a file</span>
    <button id="save-btn" onclick="saveFile()">SAVE</button>
    <span id="status">Saved!</span>
  </div>
  <textarea id="editor" spellcheck="false" placeholder="Select a file to edit..."></textarea>
</div>

<script>
let currentFile = null;

async function loadFiles() {
  const res = await fetch("/api/admin/files");
  const files = await res.json();
  const list = document.getElementById("file-list");
  list.innerHTML = "";
  files.forEach(f => {
    const btn = document.createElement("button");
    btn.className = "file-btn" + (f === currentFile ? " active" : "");
    btn.textContent = f;
    btn.onclick = () => openFile(f);
    list.appendChild(btn);
  });
}

async function openFile(filename) {
  currentFile = filename;
  document.getElementById("current-file").textContent = filename;
  const res = await fetch("/api/admin/file/" + encodeURIComponent(filename));
  const data = await res.json();
  document.getElementById("editor").value = data.content;
  loadFiles();
  document.getElementById("editor").focus();
}

async function saveFile() {
  if (!currentFile) return;
  const content = document.getElementById("editor").value;
  await fetch("/api/admin/file/" + encodeURIComponent(currentFile), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content })
  });
  const s = document.getElementById("status");
  s.style.opacity = "1";
  setTimeout(() => s.style.opacity = "0", 1500);
}

async function createNewFile() {
  const input = document.getElementById("new-filename");
  const name = input.value.trim();
  if (!name) return;
  await fetch("/api/admin/file/" + encodeURIComponent(name), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: "" })
  });
  input.value = "";
  openFile(name);
  loadFiles();
}

document.getElementById("editor").addEventListener("keydown", function(e) {
  if (e.key === "s" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    saveFile();
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const s = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, s) + "  " + this.value.substring(end);
    this.selectionStart = this.selectionEnd = s + 2;
  }
});

loadFiles();
</script>

</body>
</html>
