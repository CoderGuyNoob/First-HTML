name: Remote Sync to Tailscale Funnel

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout fresh code from GitHub
        uses: actions/checkout@v4

      - name: Sync Files to Python Site Directory
        shell: powershell
        run: |
          $sitePath = "C:\Users\carri\vir dev\First HTML"

          # This safely grabs files from the runner directory and mirrors them into your website directory
          robocopy . $sitePath /MIR /XD .git .github /R:3 /W:1
          
          if ($LastExitCode -le 3) { $global:LastExitCode = 0 }
          
          Write-Host "Code successfully updated on vir-s-laptop!" -ForegroundColor Green