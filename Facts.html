<div class="recipe-app">

  <div class="recipe-sidebar">
    <input id="search" type="text" placeholder="Search recipes...">

    <div id="recipeList"></div>

    <div class="sidebar-buttons">
      <button onclick="newRecipe()">New Recipe</button>
      <button onclick="exportCSV()">Export CSV</button>
      <input type="file" id="csvImport" accept=".csv">
    </div>
  </div>

  <div class="recipe-main">

    <input id="title" type="text" placeholder="Recipe Name">

    <input id="tags" type="text" placeholder="Tags (Dinner, Chicken, Pasta...)">

    <input id="servings" type="number" placeholder="Servings">

    <input id="image" type="text" placeholder="Image URL">

    <h3>Ingredients</h3>
    <textarea id="ingredients"></textarea>

    <h3>Instructions</h3>
    <textarea id="instructions"></textarea>

    <h3>Nutrition</h3>
    <textarea id="nutrition"></textarea>

    <div class="button-row">
      <button onclick="saveRecipe()">Save</button>
      <button onclick="favoriteRecipe()">★ Favorite</button>
      <button onclick="deleteRecipe()">Delete</button>
    </div>

  </div>

</div>

<script>
let recipes = JSON.parse(localStorage.getItem("recipes") || "[]");
let selected = null;

function saveData() {
    localStorage.setItem("recipes", JSON.stringify(recipes));
}

function saveRecipe() {

    const recipe = {
        title: title.value,
        tags: tags.value,
        servings: servings.value,
        image: image.value,
        ingredients: ingredients.value,
        instructions: instructions.value,
        nutrition: nutrition.value,
        favorite: selected !== null
            ? recipes[selected].favorite
            : false
    };

    if(selected === null)
        recipes.push(recipe);
    else
        recipes[selected] = recipe;

    saveData();
    renderList();
}

function renderList() {

    const searchText =
        search.value.toLowerCase();

    recipeList.innerHTML = "";

    recipes
    .filter(recipe =>
        recipe.title.toLowerCase().includes(searchText) ||
        recipe.tags.toLowerCase().includes(searchText)
    )
    .sort((a,b) =>
        (b.favorite === true) - (a.favorite === true)
    )
    .forEach((recipe,index) => {

        const card = document.createElement("div");

        card.className = "recipe-card";

        card.innerHTML = `
            <div class="recipe-card-title">
                ${recipe.favorite ? "★ " : ""}
                ${recipe.title}
            </div>

            <div class="recipe-card-tags">
                ${recipe.tags}
            </div>
        `;

        card.onclick = () => loadRecipe(index);

        recipeList.appendChild(card);
    });
}

function loadRecipe(index) {

    selected = index;

    const r = recipes[index];

    title.value = r.title || "";
    tags.value = r.tags || "";
    servings.value = r.servings || "";
    image.value = r.image || "";
    ingredients.value = r.ingredients || "";
    instructions.value = r.instructions || "";
    nutrition.value = r.nutrition || "";
}

function newRecipe() {

    selected = null;

    title.value = "";
    tags.value = "";
    servings.value = "";
    image.value = "";
    ingredients.value = "";
    instructions.value = "";
    nutrition.value = "";
}

function deleteRecipe() {

    if(selected === null) return;

    recipes.splice(selected,1);

    selected = null;

    saveData();
    renderList();
    newRecipe();
}

function favoriteRecipe() {

    if(selected === null) return;

    recipes[selected].favorite =
        !recipes[selected].favorite;

    saveData();
    renderList();
}

function exportCSV() {

    let csv =
        "Title,Tags,Servings,Image,Ingredients,Instructions,Nutrition,Favorite\n";

    recipes.forEach(r => {

        csv += `"${r.title}","${r.tags}","${r.servings}","${r.image}","${r.ingredients}","${r.instructions}","${r.nutrition}","${r.favorite}"\n`;

    });

    const blob =
        new Blob([csv], {type:"text/csv"});

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "recipes.csv";

    link.click();
}

csvImport.addEventListener("change", e => {

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = event => {

        const rows =
            event.target.result
                .split("\n")
                .slice(1);

        recipes = [];

        rows.forEach(row => {

            const cols =
                row.match(/(".*?"|[^,]+)/g);

            if(!cols || cols.length < 8) return;

            recipes.push({
                title: cols[0].replace(/^"|"$/g,""),
                tags: cols[1].replace(/^"|"$/g,""),
                servings: cols[2].replace(/^"|"$/g,""),
                image: cols[3].replace(/^"|"$/g,""),
                ingredients: cols[4].replace(/^"|"$/g,""),
                instructions: cols[5].replace(/^"|"$/g,""),
                nutrition: cols[6].replace(/^"|"$/g,""),
                favorite:
                    cols[7]
                    .replace(/^"|"$/g,"") === "true"
            });

        });

        saveData();
        renderList();
    };

    reader.readAsText(file);
});

search.addEventListener(
    "input",
    renderList
);

renderList();
</script>
