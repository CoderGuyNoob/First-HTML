<div class="nav-bar-wrapper">
  <button id="themeToggle" class="theme-toggle-btn">
    <span id="themeText">Dark Mode</span>
  </button>

  <div class="nav-background">
    <a href="/home" class="nav-button">Home</a>
    <a href="/recipes" class="nav-button">Recipes</a>
    <a href="/about" class="nav-button">About</a>
    <a href="/code" class="nav-button">Code</a>
    <a href="/jeopardy" class="nav-button">Jeopardy</a>
  </div>

  <script>
    (function () {
      const btn = document.getElementById("themeToggle");
      const text = document.getElementById("themeText");

      const updateUI = () => {
        const isDark =
          document.documentElement.classList.contains("dark-theme");
        text.innerText = isDark ? "Light Mode" : "Dark Mode";
      };

      // Set initial button text based on the class set in <head>
      updateUI();

      btn.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark-theme");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateUI();
      });
    })();
  </script>
</div>
